<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script>
    if (localStorage.getItem('mirath_terms_v1') !== 'accepted') {
      window.location.replace('entry.html');
    }
  </script>

  <!-- baaki existing head code -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الفرائض — حاسبة المواريث الشرعية</title>
  <link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">

<meta name="theme-color" content="#0f766e">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mīrāth">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
</>
<body>
<div class="bg"><i class="orb o1"></i><i class="orb o2"></i><i class="orb o3"></i><div class="pattern"></div></div>
<header class="glass topbar">
  <div class="brand">
  <img class="brand-logo" src="logo.png" alt="Mīrāth logo">
  <div><h1>الفرائض</h1><p>حاسبة المواريث الشرعية</p></div>
  </div>
  <button id="theme" class="icon glass-pill" aria-label="تبديل المظهر">◐</button>
</header>

<main>
  <p class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</p>

  <section id="estate" class="tab active">
    <div class="glass card">
      <h2>المتوفى</h2>
      <div class="seg" id="sex"><button data-v="m" class="on">ذكر</button><button data-v="f">أنثى</button></div>
    </div>
    <div class="glass card">
      <h2>التركة</h2>
      <label>إجمالي التركة<input type="number" id="total" inputmode="decimal" placeholder="0" min="0"></label>
      <label>الديون<input type="number" id="debt" inputmode="decimal" placeholder="0" min="0"></label>
      <label>تجهيز الميت ودفنه<input type="number" id="funeral" inputmode="decimal" placeholder="0" min="0"></label>
      <label>الوصية <small>(لا تزيد على الثلث)</small><input type="number" id="will" inputmode="decimal" placeholder="0" min="0"></label>
      <details class="adv"><summary>خيارات متقدمة: الوصية والمنهج</summary>
        <label>الموصى له<select id="wtype"><option value="non">غير وارث</option><option value="heir">وارث</option><option value="charity">جهة خيرية</option></select></label>
        <label>إجازة الورثة للوصية<select id="wcons"><option value="no">لا توجد إجازة</option><option value="yes">أجاز الورثة</option></select></label>
        <label>سياسة الرد<select id="policy"><option value="jumhur1">الرد على غير الزوجين فقط (المعتمد)</option><option value="jumhur1_rs">يُرد على الزوج/الزوجة إن انفردا</option></select></label>
      </details>
      <button class="reset glass-pill">إعادة تعيين</button>
    </div>
  </section>

  <section id="heirs" class="tab">
    <div class="glass card"><h2>الورثة</h2><div id="list"></div>
      <details class="adv"><summary>حالة الوارث: رقيق (متقدم)</summary>
        <label>الفئة<select id="stCat"></select></label>
        <label>عدد الأرقاء منهم (الرقيق لا يرث ولا يحجب)<input type="number" id="stN" min="0" max="30" value="0" inputmode="numeric"></label>
      </details><button class="reset glass-pill">إعادة تعيين</button></div>
  </section>

  <section id="result" class="tab">
    <div class="glass card hero"><small>الصافي للتقسيم</small><strong id="net">0</strong><span id="meta"></span></div>
    <div class="glass card flow" id="flow"></div>
    <div class="glass card warn" id="msgs" hidden></div>
    <h2 class="hd" id="hd" hidden>أنصبة الورثة</h2>
    <div id="rows"></div>
    <div class="glass card note" id="note"></div>
  </section>

  <p class="verse">يُوصِيكُمُ اللَّهُ فِي أَوْلَادِكُمْ ۖ لِلذَّكَرِ مِثْلُ حَظِّ الْأُنثَيَيْنِ</p>
</main>

<div id="toast" class="glass toast" role="status" aria-live="polite"></div>
<nav class="glass tabbar">
  <button data-t="estate" class="on"><b>◈</b><span>التركة</span></button>
  <button data-t="heirs"><b>❖</b><span>الورثة</span></button>
  <button data-t="result"><b>✧</b><span>النتيجة</span></button>
</nav>
<script src="script.js"></script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .catch(error => {
        console.error("Service Worker registration failed:", error);
      });
  });
}
  </script>
</body>
</html>
